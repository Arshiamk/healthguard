[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "healthguard"
version = "0.1.0"
description = "Clinical AI guardrails: PHI redaction, hallucination detection, policy enforcement, and audit trails for LLMs in healthcare"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Arshiamk", email = "arshia@live.co.uk" }]
keywords = [
  "healthcare",
  "clinical-ai",
  "llm",
  "guardrails",
  "phi",
  "hipaa",
  "fhir",
  "patient-safety",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7.0",
  "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
openai = ["openai>=1.30.0"]
anthropic = ["anthropic>=0.28.0"]
litellm = ["litellm>=1.40.0"]
audit = ["structlog>=24.1.0"]
all = [
  "openai>=1.30.0",
  "anthropic>=0.28.0",
  "litellm>=1.40.0",
  "structlog>=24.1.0",
]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "types-requests>=2.32.0",
]

[project.urls]
Homepage = "https://github.com/Arshiamk/healthguard"
Repository = "https://github.com/Arshiamk/healthguard"
"Bug Tracker" = "https://github.com/Arshiamk/healthguard/issues"
Documentation = "https://github.com/Arshiamk/healthguard#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/healthguard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

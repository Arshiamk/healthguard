version: 2

updates:
  # Workflow actions are pinned to commit SHAs, which never resolve forward on
  # their own. Without this they silently rot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"
    groups:
      dev-dependencies:
        dependency-type: development
